[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rmerrata"
version = "2.0.0"
description = "Deterministic extractor for ST STM32 device-errata PDFs (ESxxxx) into selective-RAG JSON"
requires-python = ">=3.10"
dependencies = ["pdfplumber>=0.11"]

[project.scripts]
rmerrata = "rmerrata.cli:main"

[tool.setuptools.packages.find]
where = ["src"]