[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stm32fetch"
version = "0.1.0"
description = "Fetch ST STM32 reference manuals and batch-run rmtables over them"
requires-python = ">=3.10"
dependencies = ["curl_cffi>=0.7"]

[project.scripts]
stm32fetch = "stm32fetch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
