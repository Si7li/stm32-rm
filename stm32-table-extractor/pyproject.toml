[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rmtables"
version = "0.1.0"
description = "Deterministic table extractor for ST STM32 reference manuals"
requires-python = ">=3.10"
dependencies = ["pdfplumber>=0.11"]

[project.scripts]
rmtables = "rmtables.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
